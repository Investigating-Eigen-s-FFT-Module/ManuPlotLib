[paths]
benchmark_repo_root = "../eigen-fft-accuracy-bench"         # root of benchmark repo relative to GearshifftEvaluation root dir
output_dir          = "output_acc_bench/"                   # default place to store program outputs (plots etc.)
benchmark_templates_path = "accbench_benchmark.toml" # location of benchmark templates relative to root/templates
plot_templates_path = "accbench_plot.toml" # location of plot templates relative to root/templates
cache_dir           = ".cache_acc_banch/"                   # default place to cache information
input_file_dirs     = []        # set of dirs, whose contents should be in the working directory of
                                                 # the benchmark binary. Relative to gearshifft_root

# Defines parameters for injected CMakeUserPresets.json
# of benchmarking repo. Only relevant if the benchmarking
# repo doesn't have a CMakeUserPresets.json yet.
# Should typically match CMakePresets.json parameters.
[cmake_user_presets]
"$schema" = "https://raw.githubusercontent.com/Kitware/CMake/refs/tags/v3.31.5/Help/manual/presets/schema.json"
"version" = 10
"cmakeMinimumRequired" = {"major" = 3, "minor" = 31, "patch" = 0}

# Mapping from relevant CMake preset cacheVariables
# of benchmarking repo  to benchmark template keys.
# (Additional cache vars without any map defined here
# can always be set with key
# "cache_vars" in benchmark_templates.toml)
[build_template_variables]
"ACCBENCH_PRECISION_DOUBLE"    = "double"
"ACCBENCH_PRECISION_FLOAT"  = "float"
"ACCBENCH_BUILD_KISSFFT"       = "kissfft"
"ACCBENCH_BUILD_POCKETFFT"    = "pocketfft"
"ACCBENCH_BUILD_FFTW"      = "fftw"
"ACCBENCH_BUILD_MKL" = "mkl"
"ACCBENCH_USE_TESTING_VERSION" = "test_my_version"

# TODO: allow for implementation-specific build_template_variable mappings

# Base mapping from relevant runtime arguments (flags) 
# of benchmarking repo to benchmark template keys
# Implementation-specific flags can be set
# below and inherit from this map
[base_run_template_variables]
"-f" = "extents"
"-r" = "reps"
"-R" = "real"
"-C" = "complex"

# Mapping from implementation key
# to different implementations
# ! output binaries *relative to* build folder
[implementations]
[implementations.fftwd]
"binary" = "accbench_fftwd"
[implementations.fftwf]
"binary" = "accbench_fftwf"
[implementations.kissfftd]
"binary" = "accbench_kissfftd"
[implementations.kissfftf]
"binary" = "accbench_kissfftf"
[implementations.pocketfftd]
"binary" = "accbench_pocketfftd"
[implementations.pocketfftf]
"binary" = "accbench_pocketfftf"
[implementations.mkld]
"binary" = "accbench_mkld"
[implementations.mklf]
"binary" = "accbench_mklf"

# TODO: make these optional if they just inherit base
# Usually, all specified implementation
# runtime args inherit from
# key `base_run_template_variables`
[implementations.fftwd.run_template_variables]
"inherits" = "base_run_template_variables"
[implementations.fftwf.run_template_variables]
"inherits" = "base_run_template_variables"

[implementations.kissfftd.run_template_variables]
"inherits" = "base_run_template_variables"
[implementations.kissfftf.run_template_variables]
"inherits" = "base_run_template_variables"

[implementations.pocketfftd.run_template_variables]
"inherits" = "base_run_template_variables"
[implementations.pocketfftf.run_template_variables]
"inherits" = "base_run_template_variables"

[implementations.mkld.run_template_variables]
"inherits" = "base_run_template_variables"
[implementations.mklf.run_template_variables]
"inherits" = "base_run_template_variables"

# TODO: allow for implementation-specific mappings here too
# Defines required mappings from `gearshifft-eval` flags
# to corresponding flags of implementation binaries
[parse_cli_variables]
"benchmark_tag" = "-t"
"output_file" = ">" # can be '>' if implemementation binary
                     # prints csv to stdout

# If needed, add mapping to custom parsers for certain runtime flags.
# Custom parsers are defined in CustomParsers.jl
[custom_flag_parser]
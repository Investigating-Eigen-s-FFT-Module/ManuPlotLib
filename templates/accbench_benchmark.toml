[base]
cmake_inherits = ["default"] # REQUIRED: base preset in <benchmark root>/CMakePresets.json
# Build Settings - mapping to CMake cache variables in config.toml
double = "ON"
float = "ON"
test_my_version = "ON" # Use my fork of eigen
kissfft = "OFF"
pocketfft = "OFF"
fftw = "OFF"
mkl = "OFF"
cache_vars     = {} # Any other CMake cacheVariables as Pairs, e.g. {CMAKE_C_COMPILER = "gcc", ...}
# Runtime Settings
extents        = ["test.conf"]
real           = true  # run r2c/c2r benchmarks
complex        = true  # run c2c benchmarks
reps = 1

# 1D serial primes benchmarks
[base-1D-prime]
inherits = "base"
float = "OFF"
extents = ["1d_primes.conf"]

[eigen-kissfft-prime]
inherits = "base-1D-prime"
kissfft = "ON"
implementation = "kissfftd"

[eigen-pocketfft-prime]
inherits = "base-1D-prime"
pocketfft = "ON"
implementation = "pocketfftd"

[eigen-mkl-prime]
inherits = "base-1D-prime"
mkl = "ON"
implementation = "mkld"

[eigen-fftw-prime]
inherits = "base-1D-prime"
fftw = "ON"
implementation = "fftwd"